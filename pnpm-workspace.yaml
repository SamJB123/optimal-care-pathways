# The catalog and overrides below are the aicolab-portal monorepo's, copied verbatim
# (with the lockfile — see README "Dependencies follow the monorepo"); the pathways-
# specific lines are marked. Package patches: only the ones this repo installs.
packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@biomejs/biome': ^2.5.14
  '@cloudflare/vite-plugin': ^1.57.1
  '@cloudflare/vitest-pool-workers': ^0.22.0
  # v5 = latest-runtime types only (dated entrypoints dropped). Workers type
  # themselves via `wrangler types`; the bare entrypoint is all we use.
  '@cloudflare/workers-types': ^5.20260921.1
  # Agents SDK ≥0.22 vendors PartyServer into `agents/lifecycle`; the DO name
  # is `ctx.id.name` (workerd#2240 resolved) — no setName / room header.
  agents: ^0.24.0
  '@modelcontextprotocol/sdk': ^1.30.0
  # @moq/net + @moq/watch are PATCHED (patches/@moq__*): pinned exact and
  # declared only here, so every consumer (kolo, moq-lab, threejs) resolves
  # the one patched instance — a literal pin elsewhere silently gets an
  # unpatched copy.
  # HELD (2026-09-22 sweep) at the patched versions: @moq/net 0.3.5 restructured
  # subscriptions around draft-20 join filters + fills — the area the moq-lab patch
  # extends with its start-group wire option — and its Safari gate now cites a second
  # WebKit bug (moq-dev/moq#2388, stream exhaustion) the lab's override must be
  # re-tested against. Re-port is its own task: memory moq-net-0-3-5-report.
  '@moq/net': 0.3.3
  '@moq/watch': 0.5.2
  '@moq/hang': 0.4.2
  '@solidjs/h': 2.0.0-rc.8
  '@solidjs/universal': 2.0.0-rc.8
  # The canonical Solid vite plugin (vite-plugin-solid was renamed at
  # 3.0.0-next.28; the old name ends at next.27 as a re-export shim). next.43
  # bundles @solidjs/compiler ^2.0.0-rc.8 — the compiler cut for this runtime
  # (next.44 moves to rc.9). The rc line must move as ONE set (see overrides): a
  # newer compiler emits runtime helpers (readShallow) an older web lacks.
  '@solidjs/vite-plugin': 3.0.0-next.43
  # rc.8, not rc.9 (2026-09-22): @tanstack/solid-start 2.0.0-rc.8 imports
  # `parseServerFunctionUrl` from @solidjs/web/server-functions, which rc.9 renamed
  # to `parseServerFunctionActionUrl`. Move to rc.9 when TanStack's rc does.
  '@solidjs/web': 2.0.0-rc.8
  '@tailwindcss/typography': ^0.5.19
  '@tailwindcss/vite': ^4.3.2
  # TanStack AI provider packages are advanced with core as a compatible set.
  '@tanstack/ai': ^0.58.0
  '@tanstack/ai-anthropic': ^0.18.10
  '@tanstack/ai-client': ^0.33.2
  '@tanstack/ai-gemini': ^0.31.2
  '@tanstack/ai-ollama': ^0.11.6
  '@tanstack/ai-openai': ^0.23.1
  '@tanstack/ai-react': ^0.27.3
  '@tanstack/devtools-event-client': ^0.5.0
  '@tanstack/devtools-vite': ^0.8.5
  '@tanstack/query-db-collection': ^1.2.11
  '@tanstack/react-db': ^0.4.1
  '@tanstack/react-devtools': ^0.10.5
  '@tanstack/react-query': ^5.103.2
  '@tanstack/react-query-devtools': ^5.102.8
  '@tanstack/react-router': ^1.170.38
  '@tanstack/react-router-devtools': ^1.167.0
  '@tanstack/react-router-ssr-query': ^1.167.1
  '@tanstack/react-start': ^1.168.25
  '@tanstack/react-store': ^0.11.0
  '@tanstack/router-plugin': ^1.168.40
  '@tanstack/store': ^0.11.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/react': ^16.3.2
  '@types/node': ^26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # 0.185.4 ships the NodeExtras refactor (the former aicolab patch that kept
  # tsgo from blowing up on Node<TNodeType>) — no patch needed any more.
  '@types/three': ^0.186.0
  # yjs v14 line — pinned EXACT (RC): doc-sync builds on the unified-YType/delta
  # API which is still moving between RCs, and @y/y + lib0 must advance as a
  # matched pair. Single yjs copy is load-bearing (instanceof checks break on
  # double-import), so nothing outside the catalog may declare its own version.
  # rc.26 / rc.32 / prosemirror -12: Node API and view-based cursor mapping.
  '@y/y': 14.0.0-rc.26
  lib0: 1.0.0-rc.32
  # Catalogued (was a literal in four package.json files) so ONE copy binds ProseKit.
  '@y/prosemirror': 2.0.0-12
  '@vitejs/plugin-react': ^6.0.2
  '@vitejs/plugin-rsc': 0.5.35
  better-auth: ^1.7.5
  capnweb-experimental-hibernation: 0.12.0-hibernation.3
  convex: ^1.46.0
  crashcat: ^0.0.5
  # Clean rc.4 releases (the `rc` dist-tag) — the repo previously rode
  # side-branch snapshot builds (orm rc.4-5d5b77c, kit rc.4-ca0f029) via a
  # ^rc.2 range; pinned exact so lockfile rebuilds can't float them onto
  # branch snapshots again (rc.4-de6c356 broke types in packages/cloudflare
  # tanstack-db-durable-objects and better-auth d1).
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  highlight.js: ^11.12.0
  jsdom: ^30.1.0
  # insight-bridge-pipeline zone: cl100k_base chunking parity with the Python oracle; embeddings + media APIs.
  js-tiktoken: ^1.0.21
  openai: ^7.20.0
  # zip expansion + XLSX (which is a zip of XML) at ingest, in the Worker
  fflate: ^0.8.3
  # Accessible .docx generation in the Worker (workplace-passport exports a
  # passport laid out like the APSC template, with real headings and tables).
  docx: ^9.7.1
  # the pipeline zone's clustering container (Cloudflare Containers SDK)
  '@cloudflare/containers': ^0.3.7
  # SQLite-in-wasm: the pipeline zone builds downloadable .sqlite exports of a run in the Worker
  sql.js: ^1.14.2
  koota: ^0.6.6
  lucide-react: ^1.47.0
  mathcat: ^0.0.14
  playwright: ^1.63.0
  resend: ^6.28.1
  react: ^19.3.0
  react-dom: ^19.3.0
  sharp: ^0.35.4
  # ProseKit: ONE copy repo-wide (ui-solid's editor bindings + hive's tests
  # compose extensions from both; two @prosekit/core copies fail its facet
  # union assertion).
  '@prosekit/core': 0.13.3
  '@prosekit/extensions': 0.18.3
  '@prosekit/pm': 0.1.20
  # (pathways) The flat-list model under @prosekit/extensions/list, imported directly for
  # the one list kind ProseKit's types do not name ('check'). Same version as prosekit.
  prosemirror-flat-list: 0.7.1
  # (pathways) the review diff: a draft body annotated against the published body (decision 96).
  prosemirror-changeset: 2.4.3
  # (pathways) the template extractor (Node script) and the audit review page (browser)
  # read the 2026 template PDFs: structure tree + marked content + fonts.
  # pdf.js renders template figures through its own optional `@napi-rs/canvas`; the app
  # declares no copy of its own — a second copy's Path2D is rejected by the first's canvas.
  pdfjs-dist: ^6.3.289
  # Storybook: one version for ui (React) and ui-solid (Solid) so the shared
  # addons stay aligned.
  storybook: ^10.6.0
  '@storybook/addon-docs': ^10.6.0
  '@storybook/react': ^10.6.0
  '@storybook/react-vite': ^10.6.0
  storybook-solidjs-vite: ^10.7.2
  solid-js: 2.0.0-rc.8
  streamdown: ^2.5.0
  suspend-react: ^0.1.3
  tailwindcss: ^4.3.2
  # r186 includes shared-depth/pass/stencil fixes; retain only depth-stencil sampling patch.
  three: ^0.186.0
  three-bvh-csg: 0.0.18
  three-mesh-bvh: ^0.9.15
  tsx: ^4.23.15
  turbo: ^2.11.2
  typescript: ~7.0.2
  vite: ^8.3.0
  vite-tsconfig-paths: ^6.1.1
  # Kept ONLY as storybook-solidjs-vite's required peer (ui-solid): next.27 is
  # the old name's final release, a re-export shim over @solidjs/vite-plugin.
  # Everything else imports @solidjs/vite-plugin directly.
  vite-plugin-solid: 3.0.0-next.27
  # vitest 5 is out (2026-09) but @cloudflare/vitest-pool-workers 0.22 peers on ^4.1;
  # held until the pool moves.
  vitest: ^4.1.11
  wrangler: ^4.136.1
  zod: ^4.6.5
  syncpack: ^15.3.3
  three-html-render: ^0.1.2
  '@webgpu/types': ^0.1.74
  # 0.9.2: ordered durable confirmations and data-only boundary filtering.
  # See TANSTACK_DB_INVESTIGATION_2026-09-22.md for rationale and validation.
  '@tanstack/db': ^0.9.2
  '@tanstack/db-ivm': ^0.1.19
  # Client-side SQLite-on-OPFS persistence for TanStack DB (hub's desktop state).
  # wa-sqlite is its peer dep — ships prebuilt WASM (base64-inlined in the
  # package's worker asset), no install scripts, no bundler config needed.
  '@tanstack/browser-db-sqlite-persistence': ^0.2.23
  '@journeyapps/wa-sqlite': ^1.7.2
  '@testing-library/jest-dom': ^7.0.1
  cbor-x: ^1.6.6
  # TanStack Form on Solid 2: the published @tanstack/solid-form adapter needs
  # Solid 1 primitives (createComputed/onMount/splitProps) that Solid 2 dropped,
  # so zone-alliance vendors the adapter (src/form/) over these two:
  '@tanstack/form-core': ^1.33.5
  '@tanstack/solid-store': ^0.11.1
  # TanStack's Solid packages ride the `rc` dist-tag, kept in step with solid-js
  # (solid-start rc.8 peers on @solidjs/web >= rc.6). Devtools lags at rc.6.
  '@tanstack/solid-router-devtools': 2.0.0-rc.6
  '@tanstack/solid-router': 2.0.0-rc.8
  '@tanstack/solid-start': 2.0.0-rc.8
  ws: ^8.21.3
  '@types/ws': ^8.18.1
  d3-force: ^3.0.0
  '@types/d3-force': ^3.0.10
  '@cloudflare/puppeteer': ^1.4.0
  jose: ^6.2.12
  # marked ≥16 is ESM-only (node ≥20); 15/17/18 changed token shapes
  # (renderer-side HTML escaping, list/checkbox tokens, trailing blank-line
  # trimming) — insights' note-index lexer consumer is the one to watch.
  marked: ^18.0.13
  # maplibre 6: ESM-only, WebGL2 required, `GeoJSONSource.setData` lost its
  # second arg, `Map` composes (not extends) Camera.
  maplibre-gl: ^6.10.0
  # SDK pin for threejs-playground's generated module_bindings (CLI 2.8.3
  # output; regenerate with `spacetime generate` when the CLI is available).
  spacetimedb: 2.10.1
  # Prompt templates: Liquid is parsed to an AST and interpreted — no
  # `new Function`, which Workers forbid (Handlebars/nunjucks/eta generate JS).
  liquidjs: 10.29.0
  yaml: ^2.9.1
  # Full HTML entity decoding for ingested HTML (python html.unescape parity).
  entities: ^8.1.0
  # XLSX sheets are XML: parsed, not regex-scanned.
  fast-xml-parser: ^5.11.1
  # Follows @tanstack/ai's EXACT dependency: the pipeline zone imports EventType
  # from @ag-ui/core and compares it against events @tanstack/ai emits, so the two
  # must be one instance. 1.0.0 is out; move both when @tanstack/ai does.
  '@ag-ui/core': 0.1.1-canary.beta.0
  gpt-tokenizer: ^4.0.0

catalogMode: prefer

# pnpm 11 defaults to a 24h minimumReleaseAge (hides/refuses versions younger
# than a day). Decision 2026-08-28: off — `pnpm outdated` and installs must
# see the newest publish, and the catalog is bumped deliberately anyway.
minimumReleaseAge: 0

# Pin @tanstack/db to ONE version repo-wide. @aicolab/room-service and
# @aicolab/cloudflare both declare ^0.6.2; without the pin, freshly-created
# peer-hash instances of @aicolab/cloudflare resolve the latest patch (0.6.8)
# while room-service stays on 0.6.5, and the two Collection classes (nominal —
# private fields) stop being assignable where a DO hands collections across
# the package boundary (e.g. threejs-playground src/broker/cell-directory.ts).
# Bump deliberately, in one move, for every consumer.
overrides:
  '@tanstack/db': 0.9.2
  # Single-copy yjs v14 everywhere (double-import breaks instanceof): pin the
  # catalog versions onto transitive rangers too (@y/prosemirror declares
  # ^14.0.0-rc.23 / ^1.0.0-rc.32 — same pair, held to our exact pins).
  '@y/y': 14.0.0-rc.26
  lib0: 1.0.0-rc.32
  # ONE compiler copy repo-wide (both plugin names pinned so transitively-
  # ranged copies can't float). The 2026-07-19 next.5 hold-back is over: the
  # AST-native compiler matured and the rc-line plugin (next.34) is the one
  # cut against solid-js 2.0.0-rc.3.
  vite-plugin-solid: 3.0.0-next.27
  '@solidjs/vite-plugin': 3.0.0-next.43
  # The Solid 2 rc family resolves as ONE matched set. solid-js ranges its signals
  # package and the vite plugin ranges the compiler + babel plugin; pinned so a
  # fresh lockfile (or a consumer repo's) cannot float any one of them.
  '@solidjs/signals': 2.0.0-rc.8
  '@solidjs/compiler': 2.0.0-rc.8
  '@solidjs/babel-plugin': 2.0.0-rc.8
  # ONE @moq/net: @moq/hang, @moq/json and @moq/loc range onto 0.3.5; two copies
  # split the Producer types. Pinned to the patched, catalogued version.
  '@moq/net': 0.3.3
  # …and ONE @moq/hang: @moq/watch 0.5.2 ranges onto 0.4.3 while the catalog holds 0.4.2.
  '@moq/hang': 0.4.2
  # ONE zod copy: @cloudflare/vitest-pool-workers 0.22 pins 4.4.3 exactly, which
  # split @tanstack/ai into two instances and broke its EventType identity.
  zod: 4.6.5

# @convex-dev/better-auth (0.12.5) still peers on better-auth <1.7. The Convex
# adapter is incidental (a couple of playgrounds); better-auth is platform-wide,
# so it moves to 1.7 and this mismatch is allowed explicitly (decision 2026-08-28).
peerDependencyRules:
  allowedVersions:
    '@convex-dev/better-auth>better-auth': '1.7'

# Resolve every workspace project's peer dependencies from the root project's
# dependencies. Combined with solid-js / @solidjs/web declared in the root
# package.json, this forces the single catalogued Solid beta onto the
# build-time Solid toolchain that TanStack Start pulls in transitively as
# auto-installed peers — which pnpm.overrides cannot reach.
resolvePeersFromWorkspaceRoot: true

patchedDependencies:
  # (pathways) Only what this repo installs; the monorepo also patches moq and three.
  '@tanstack/db@0.9.2': patches/@tanstack__db@0.9.2.patch

allowBuilds:
  '@google/genai': true
  '@journeyapps/wa-sqlite': false
  canvas: set this to true or false
  cbor-extract: true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
